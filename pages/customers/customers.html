<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Mise — Customers</title>
  <script src="../../js/mise/auth.js"></script>
  <script src="../../js/mise/theme.js"></script>
  <!-- plugins:css -->
  <link rel="stylesheet" href="../../vendors/feather/feather.css">
  <link rel="stylesheet" href="../../vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="../../vendors/ti-icons/css/themify-icons.css">
  <link rel="stylesheet" href="../../vendors/typicons/typicons.css">
  <link rel="stylesheet" href="../../vendors/simple-line-icons/css/simple-line-icons.css">
  <link rel="stylesheet" href="../../vendors/css/vendor.bundle.base.css">
  <!-- endinject -->
  <!-- inject:css -->
  <link rel="stylesheet" href="../../css/vertical-layout-light/style.css">
  <link rel="stylesheet" href="../../css/mise.css">
  <!-- endinject -->
  <link rel="icon" type="image/svg+xml" href="../../images/favicon.svg" />
</head>
<body data-page-title="Customers" data-page-sub="Your guests, regulars and what they say about you">
  <div class="container-scroller">
    <div data-mise-slot="navbar"></div>
    <div class="container-fluid page-body-wrapper">
      <div data-mise-slot="sidebar"></div>
      <div class="main-panel">
        <div class="content-wrapper">
          <div class="row">
            <div class="col-sm-12">
              <div class="home-tab">
                <div class="d-sm-flex align-items-center justify-content-between border-bottom pb-2 mise-toolbar">
                  <div class="py-2"><input type="search" class="form-control" id="customer-search" placeholder="Search guests" style="min-width:240px"></div>
                  <div class="btn-wrapper d-flex flex-wrap gap-2 align-items-center"><select class="form-select" id="sort" aria-label="Sort"><option value="spent">Top spenders</option><option value="visits">Most visits</option><option value="recent">Recent visits</option><option value="name">Name A–Z</option></select><button class="btn btn-primary text-white me-0" id="add-customer"><i class="mdi mdi-account-plus"></i> Add guest</button></div>
                </div>
                <div class="tab-content tab-content-basic">
                  <div class="row">
                    <div class="col-sm-12">
                      <div class="statistics-details d-flex align-items-center justify-content-between mise-kpi" id="stats"></div>
                    </div>
                  </div>
                  <div class="row">
                  <div class="col-lg-8 d-flex flex-column">
                    <div class="row flex-grow mise-stack">
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">Guest list</h4>
                              <p class="card-subtitle card-subtitle-dash" id="count"></p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"></div>
                          </div>
                          <div class="table-responsive">
                            <table class="table select-table mise-table">
                              <thead><tr><th>Guest</th><th>Phone</th><th>Visits</th><th>Spent</th><th>Last visit</th><th>Tags</th><th></th></tr></thead>
                              <tbody id="customers"></tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    </div>
                    </div>
                  </div>
                  <div class="col-lg-4 d-flex flex-column">
                    <div class="row flex-grow mise-stack">
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">Ratings</h4>
                              <p class="card-subtitle card-subtitle-dash">All reviews</p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"></div>
                          </div>
                          <div id="rating-dist"></div>
                        </div>
                      </div>
                    </div>
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">Reviews</h4>
                              <p class="card-subtitle card-subtitle-dash">Toggle which ones appear on your website</p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"><button class="btn btn-sm btn-otline-dark" id="add-review"><i class="mdi mdi-plus"></i> Add</button></div>
                          </div>
                          <div id="reviews"></div>
                        </div>
                      </div>
                    </div>
                    </div>
                  </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- content-wrapper ends -->
        <div data-mise-slot="footer"></div>
      </div>
      <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->

  <!-- plugins:js -->
  <script src="../../vendors/js/vendor.bundle.base.js"></script>
  <!-- endinject -->
  <!-- Plugin js for this page -->
  <script src="../../vendors/chart.js/Chart.min.js"></script>
  <!-- End plugin js for this page -->
  <!-- inject:js -->
  <script src="../../js/mise/app.js"></script>
  <script src="../../js/mise/layout.js"></script>
  <script src="../../js/mise/search.js"></script>
  <script src="../../js/off-canvas.js"></script>
  <script src="../../js/hoverable-collapse.js"></script>
  <script src="../../js/template.js"></script>
  <!-- endinject -->
  <!-- Custom js for this page-->
  <script src="../../js/mise/pages/customers.js"></script>
  <!-- End custom js for this page-->
</body>

</html>
