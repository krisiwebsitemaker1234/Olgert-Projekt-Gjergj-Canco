<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Mise — Reports</title>
  <script src="../../js/mise/auth.js"></script>
  <script src="../../js/mise/theme.js"></script>
  <!-- plugins:css -->
  <link rel="stylesheet" href="../../vendors/feather/feather.css">
  <link rel="stylesheet" href="../../vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="../../vendors/ti-icons/css/themify-icons.css">
  <link rel="stylesheet" href="../../vendors/typicons/typicons.css">
  <link rel="stylesheet" href="../../vendors/simple-line-icons/css/simple-line-icons.css">
  <link rel="stylesheet" href="../../vendors/css/vendor.bundle.base.css">
  <!-- endinject -->
  <!-- inject:css -->
  <link rel="stylesheet" href="../../css/vertical-layout-light/style.css">
  <link rel="stylesheet" href="../../css/mise.css">
  <!-- endinject -->
  <link rel="icon" type="image/svg+xml" href="../../images/favicon.svg" />
</head>
<body data-page-title="Reports" data-page-sub="Sales, costs and trends">
  <div class="container-scroller">
    <div data-mise-slot="navbar"></div>
    <div class="container-fluid page-body-wrapper">
      <div data-mise-slot="sidebar"></div>
      <div class="main-panel">
        <div class="content-wrapper">
          <div class="row">
            <div class="col-sm-12">
              <div class="home-tab">
                <div class="d-sm-flex align-items-center justify-content-between border-bottom pb-2 mise-toolbar">
                  <ul class="nav nav-tabs" role="tablist"><li class="nav-item"><a class="nav-link ps-0" href="#" data-days="7" role="tab">7 days</a></li><li class="nav-item"><a class="nav-link active" href="#" data-days="30" role="tab">30 days</a></li><li class="nav-item"><a class="nav-link border-0" href="#" data-days="90" role="tab">90 days</a></li></ul>
                  <div class="btn-wrapper d-flex flex-wrap gap-2 align-items-center"><a href="#" class="btn btn-otline-dark" id="print"><i class="icon-printer"></i> Print</a><a href="#" class="btn btn-primary text-white me-0" id="export"><i class="icon-download"></i> Export CSV</a></div>
                </div>
                <div class="tab-content tab-content-basic">
                  <div class="row">
                    <div class="col-sm-12">
                      <div class="statistics-details d-flex align-items-center justify-content-between mise-kpi" id="stats"></div>
                    </div>
                  </div>
                  <p class="text-muted small mt-n4 mb-4" id="compare-note"></p>
                  <div class="row">
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">Revenue &amp; covers</h4>
                              <p class="card-subtitle card-subtitle-dash">Daily</p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"><div id="sales-legend"></div></div>
                          </div>
                          <div class="chartjs-bar-wrapper" style="height:300px"><canvas id="salesChart"></canvas></div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="row">
                  <div class="col-lg-8 d-flex flex-column">
                    <div class="row flex-grow mise-stack">
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">Cost percentages</h4>
                              <p class="card-subtitle card-subtitle-dash">Share of revenue spent on food and labor</p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"><div id="cost-legend"></div></div>
                          </div>
                          <div style="height:340px"><canvas id="costChart"></canvas></div>
                        </div>
                      </div>
                    </div>
                    </div>
                  </div>
                  <div class="col-lg-4 d-flex flex-column">
                    <div class="row flex-grow mise-stack">
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">Sales by category</h4>
                              
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"></div>
                          </div>
                          <canvas id="categoryChart" height="190"></canvas>
                          <table class="table mise-table mt-3 mb-0"><tbody id="category-table"></tbody></table>
                        </div>
                      </div>
                    </div>
                    </div>
                  </div>
                  </div>
                  <div class="row">
                  <div class="col-lg-7 d-flex flex-column">
                    <div class="row flex-grow mise-stack">
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">Top dishes</h4>
                              <p class="card-subtitle card-subtitle-dash">Last 30 days, by revenue</p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"></div>
                          </div>
                          <div class="table-responsive">
                            <table class="table mise-table">
                              <thead><tr><th>#</th><th>Dish</th><th>Sold</th><th>Revenue</th><th>Gross profit</th></tr></thead>
                              <tbody id="top-dishes"></tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    </div>
                    </div>
                  </div>
                  <div class="col-lg-5 d-flex flex-column">
                    <div class="row flex-grow mise-stack">
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">By day of week</h4>
                              <p class="card-subtitle card-subtitle-dash">Averages for the selected range</p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"></div>
                          </div>
                          <div class="table-responsive">
                            <table class="table mise-table">
                              <thead><tr><th>Day</th><th>Revenue</th><th>Covers</th><th>Avg. check</th></tr></thead>
                              <tbody id="weekday"></tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    </div>
                    </div>
                  </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- content-wrapper ends -->
        <div data-mise-slot="footer"></div>
      </div>
      <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->

  <!-- plugins:js -->
  <script src="../../vendors/js/vendor.bundle.base.js"></script>
  <!-- endinject -->
  <!-- Plugin js for this page -->
  <script src="../../vendors/chart.js/Chart.min.js"></script>
  <!-- End plugin js for this page -->
  <!-- inject:js -->
  <script src="../../js/mise/app.js"></script>
  <script src="../../js/mise/layout.js"></script>
  <script src="../../js/off-canvas.js"></script>
  <script src="../../js/hoverable-collapse.js"></script>
  <script src="../../js/template.js"></script>
  <!-- endinject -->
  <!-- Custom js for this page-->
  <script src="../../js/mise/pages/reports.js"></script>
  <!-- End custom js for this page-->
</body>

</html>
