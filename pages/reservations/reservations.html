<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Mise — Reservations</title>
  <script src="../../js/mise/auth.js"></script>
  <script src="../../js/mise/theme.js"></script>
  <!-- plugins:css -->
  <link rel="stylesheet" href="../../vendors/feather/feather.css">
  <link rel="stylesheet" href="../../vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="../../vendors/ti-icons/css/themify-icons.css">
  <link rel="stylesheet" href="../../vendors/typicons/typicons.css">
  <link rel="stylesheet" href="../../vendors/simple-line-icons/css/simple-line-icons.css">
  <link rel="stylesheet" href="../../vendors/css/vendor.bundle.base.css">

  <link rel="stylesheet" href="../../css/vertical-layout-light/style.css">

</head>
<body data-page-title="Reservations" data-page-sub="Bookings, walk-ins and the waitlist">
  <div class="container-scroller">
    <div data-mise-slot="navbar"></div>
    <div class="container-fluid page-body-wrapper">
      <div data-mise-slot="sidebar"></div>
      <div class="main-panel">
        <div class="content-wrapper">
          <div class="row">
            <div class="col-sm-12">
              <div class="home-tab">
                <div class="d-sm-flex align-items-center justify-content-between border-bottom pb-2 mise-toolbar">
                  <div class="d-flex align-items-center gap-2 py-2"><button class="btn btn-otline-dark" id="prev-day" aria-label="Previous day"><i class="mdi mdi-chevron-left"></i></button><input type="date" class="form-control" id="day" style="max-width:170px" aria-label="Day"><button class="btn btn-otline-dark" id="next-day" aria-label="Next day"><i class="mdi mdi-chevron-right"></i></button><button class="btn btn-otline-dark" id="today">Today</button></div>
                  <div class="btn-wrapper d-flex flex-wrap gap-2 align-items-center"><button class="btn btn-otline-dark" id="new-wait"><i class="mdi mdi-account-clock-outline"></i> Add walk-in</button><button class="btn btn-primary text-white me-0" id="new-res"><i class="mdi mdi-plus"></i> New reservation</button></div>
                </div>
                <div class="tab-content tab-content-basic">
                  <div class="row">
                    <div class="col-sm-12">
                      <div class="statistics-details d-flex align-items-center justify-content-between mise-kpi" id="stats"></div>
                    </div>
                  </div>
                  <div class="row">
                  <div class="col-lg-8 d-flex flex-column">
                    <div class="row flex-grow mise-stack">
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash"><span id="timeline-title">Bookings</span></h4>
                              <p class="card-subtitle card-subtitle-dash">Tap a booking to seat, edit or cancel it</p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"></div>
                          </div>
                          <div class="mise-timeline" id="timeline"></div>
                        </div>
                      </div>
                    </div>
                    </div>
                  </div>
                  <div class="col-lg-4 d-flex flex-column">
                    <div class="row flex-grow mise-stack">
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">Waitlist</h4>
                              <p class="card-subtitle card-subtitle-dash">Walk-ins waiting for a table</p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"></div>
                          </div>
                          <div id="waitlist"></div>
                        </div>
                      </div>
                    </div>
                    <div class="col-12 grid-margin stretch-card">
                      <div class="card card-rounded">
                        <div class="card-body">
                          <div class="d-sm-flex justify-content-between align-items-start mb-3">
                            <div>
                              <h4 class="card-title card-title-dash">Next 7 days</h4>
                              <p class="card-subtitle card-subtitle-dash">Booked covers vs. capacity</p>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center"></div>
                          </div>
                          <div id="week"></div>
                        </div>
                      </div>
                    </div>
                    </div>
                  </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- content-wrapper ends -->
        <div data-mise-slot="footer"></div>
      </div>
      <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->

  <!-- plugins:js -->
  <script src="../../vendors/js/vendor.bundle.base.js"></script>
  <!-- endinject -->

  <script src="../../vendors/chart.js/Chart.min.js"></script>

  <script src="../../js/mise/app.js"></script>
  <script src="../../js/mise/layout.js"></script>
  <script src="../../js/off-canvas.js"></script>
  <script src="../../js/hoverable-collapse.js"></script>
  <script src="../../js/template.js"></script>
  <!-- endinject -->
  <!-- Custom js for this page-->
  <script src="../../js/mise/pages/reservations.js"></script>
  <!-- End custom js for this page-->
</body>

</html>
